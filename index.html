<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; background: #f3f4f6; min-height: 100vh; }
.wrap { max-width: 680px; margin: 0 auto; padding: 1rem; }

.mbtn { padding: 7px 16px; border-radius: 8px; border: 1px solid #ccc; background: #fff; color: #555; font-size: 13px; cursor: pointer; }
.mbtn.active { background: #1a56db; color: #fff; border-color: #1a56db; }

.pbar { background: #e5e7eb; border-radius: 999px; height: 6px; margin-bottom: 1.5rem; overflow: hidden; }

.sbtn.sel-spring { background: #059669; color: #fff; border-color: #059669; font-weight: 600; }
.sbtn.sel-summer { background: #d97706; color: #fff; border-color: #d97706; font-weight: 600; }

.sbtn.sel-winter { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 600; }

.subq { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; margin-top: 8px; }

.sqbtn.sel { background: #7c3aed; color: #fff; border-color: #7c3aed; font-weight: 600; }

   2) 함께 드린 Code.gs 내용을 붙여넣고 저장
   3) 배포 → 새 배포 → 웹 앱 → 액세스: "모든 사용자" → 배포
   4) 발급된 웹 앱 URL을 아래 따옴표 안에 붙여넣기
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★ */
var GAS_URL='https://script.google.com/macros/s/AKfycbxtVgYNqVirHDcF04EJQ4YypYz5dgIjF6tbofncX0CIoqDMtkjUFvOTn8z8qGb7g1PJ/exec';

var SEASON_LABEL={spring:'봄',summer:'여름',fall:'가을',winter:'겨울'};

// 구글 시트에 저장할 헤더/행 생성 (식품별 1열)
function buildSheetRow(dii,count){
  var header=['제출일시','참여자번호','DII','응답항목수'];
  var row=[new Date().toLocaleString('ko-KR'),pid,dii,count];
  S.forEach(function(sec,si){
    sec.items.forEach(function(item,idx){
      header.push('['+sec.name+'] '+item.n);
      var a=ANS[si+'_'+idx]||{};
      if(!a.freq){row.push('');return;}
      var parts=[a.freq];
      if(a.amount) parts.push(a.amount);
      if(a.seasons){
        var ss=Object.keys(a.seasons).filter(function(k){return a.seasons[k];}).map(function(k){return SEASON_LABEL[k];});
        if(ss.length) parts.push(ss.join('·'));
      }
      if(a.sub) parts.push(a.sub);
      if(a.sugar) parts.push('설탕:'+a.sugar);
      if(a.cream) parts.push('프림:'+a.cream);
      row.push(parts.join(' / '));
    });
  });
  header.push('_RAW');
  row.push(JSON.stringify(ANS));
  return {header:header,row:row};
}

function toMode(m){
  document.getElementById('mp').className='mbtn'+(m==='patient'?' active':'');
  document.getElementById('md').className='mbtn'+(m==='doctor'?' active':'');
  m==='patient' ? showId() : showDoctor();
}

function showId(){
  document.getElementById('main').innerHTML=
    '<div class="card">'+
      '<div style="font-size:15px;font-weight:600;color:#111;margin-bottom:4px;">연구 참여자 번호 입력</div>'+
      '<div style="font-size:13px;color:#888;margin-bottom:10px;">의료진이 알려드린 번호를 입력해 주세요</div>'+
      '<input class="idinput" id="pidinput" placeholder="예: 001" maxlength="10"/>'+
    '</div>'+
    '<div style="background:#eff6ff;border-radius:12px;padding:1.25rem;margin-bottom:1rem;">'+
      '<div style="font-size:13px;color:#1e40af;line-height:1.6;">지난 1년간 평균적으로 드신 식품과 양을 선택해 주세요.<br>총 7개 식품군, 약 10~15분 소요됩니다.</div>'+
    '</div>'+
    '<button class="bigbtn" onclick="startSurvey()">설문 시작하기</button>';
}

function startSurvey(){
  var v=document.getElementById('pidinput').value.trim();
  if(!v){alert('참여자 번호를 입력해 주세요.');return;}
  pid=v; ANS={}; curSec=0; renderSec();
}

function renderSec(){
  var sec=S[curSec];
  var pct=Math.round(curSec/S.length*100);
  var html=
    '<div class="stepind">'+(curSec+1)+' / '+S.length+'</div>'+
    '<div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div>'+
    '<div class="stitle">'+sec.name+'</div>'+
    '<div class="ssub">지난 1년간 평균 섭취 빈도와 1회 섭취 분량을 선택해 주세요</div>';

  sec.items.forEach(function(item,idx){
    var key=curSec+'_'+idx;
    var d=ANS[key]||{};
    var selF=d.freq||'';
    var selA=d.amount||'';
    var never=selF==='거의 안 먹음';

    var incomplete = selF==='' || (!never && !selA);
    html+='<div class="fitem" style="'+(incomplete&&selF!==''?'border-color:#ef4444;':'')+'">';
    if(item.note) html+='<div class="note">★ '+item.note+'</div>';
    html+='<div class="fname">'+item.n+'</div>';

    // [계절 과일] 드시는 계절 체크
    if(item.seasonal){
      html+='<div class="flabel">드시는 계절 (해당되는 계절 모두 선택)</div>'+
            '<div class="season-row">';
      SEASONS.forEach(function(s){
        var checked=d.seasons&&d.seasons[s.key];
        html+='<button class="sbtn'+(checked?' '+s.cls:'')+'" onclick="toggleSeason(\''+key+'\',\''+s.key+'\')">'+s.label+'</button>';
      });
      html+='</div><div class="divider"></div>';
    }

    // 섭취 빈도 (공통)
    html+='<div class="flabel">섭취 빈도</div><div class="fbtns">';
    FREQS.forEach(function(f){
      html+='<button class="fbtn'+(selF===f?' sel':'')+'" onclick="pickFreq(\''+key+'\',\''+f+'\')">'+f+'</button>';
    });
    html+='</div>';

    // 1회 섭취량 (공통 — 빈도 선택 후 거의 안 먹음이 아닐 때)
    if(selF && !never){
      html+='<div class="flabel">1회 섭취량</div><div class="abtns">';
      item.a.forEach(function(a){
        var aEsc=a.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        html+='<button class="abtn'+(selA===a?' sel':'')+'" onclick="pickAmt(\''+key+'\',\''+aEsc+'\')">'+a+'</button>';
      });
      html+='</div>';
    }

    // 세부 질문 (밥 종류, 계란 형태, 우유 형태, 요구르트 형태)
    if(item.sub && selF && !never){
      if(item.sub.opts){
        var selSub=d.sub||'';
        html+='<div class="subq">'+
          '<div class="subq-label">★ '+item.sub.q+'</div>'+
          '<div class="subq-btns">';
        item.sub.opts.forEach(function(o){
          var oEsc=o.replace(/'/g,"\\'");
          html+='<button class="sqbtn'+(selSub===o?' sel':'')+'" onclick="pickSub(\''+key+'\',\''+oEsc+'\')">'+o+'</button>';
        });
        html+='</div></div>';
      }
      // 커피 설탕/프림
      if(item.sub.opts2){
        item.sub.opts2.forEach(function(sq){
          var selSub=d[sq.k]||'';
          html+='<div class="subq">'+
            '<div class="subq-label">★ '+sq.q+'</div>'+
            '<div class="subq-btns">';
          sq.opts.forEach(function(o){
            var oEsc=o.replace(/'/g,"\\'");
            html+='<button class="sqbtn'+(selSub===o?' sel':'')+'" onclick="pickSubKey(\''+key+'\',\''+sq.k+'\',\''+oEsc+'\')">'+o+'</button>';
          });
          html+='</div></div>';
        });
      }
    }

    html+='</div>';
  });

  html+='<div class="navbtns">'+
    (curSec>0?'<button class="navbtn" onclick="goPrev()">← 이전</button>':'')+
    '<button class="navbtn pr" onclick="goNext()">'+(curSec<S.length-1?'다음 →':'제출하기')+'</button>'+
    '</div>';
  document.getElementById('main').innerHTML=html;
}

function pickSub(key,v){
  if(!ANS[key]) ANS[key]={};
  ANS[key].sub=v;
  renderSec();
}
function pickSubKey(key,k,v){
  if(!ANS[key]) ANS[key]={};
  ANS[key][k]=v;
  renderSec();
}
function toggleSeason(key,sk){
  if(!ANS[key]) ANS[key]={};
  if(!ANS[key].seasons) ANS[key].seasons={};
  ANS[key].seasons[sk]=!ANS[key].seasons[sk];
  renderSec();
}
function pickFreq(key,f){
  if(!ANS[key]) ANS[key]={};
  ANS[key].freq=f;
  if(f==='거의 안 먹음') ANS[key].amount=null;
  renderSec();
}
function pickAmt(key,a){
  if(!ANS[key]) ANS[key]={};
  ANS[key].amount=a;
  renderSec();
}
function goPrev(){if(curSec>0){curSec--;renderSec();window.scrollTo(0,0);}}
function goNext(){
  // 미완료 항목 체크
  var sec=S[curSec];
  var missing=[];
  sec.items.forEach(function(item,idx){
    var key=curSec+'_'+idx;
    var a=ANS[key]||{};
    // 섭취빈도 필수
    if(!a.freq){
      missing.push(item.n);
      return;
    }
    // 거의 안 먹음이면 이하 불필요
    if(a.freq==='거의 안 먹음') return;
    // 1회 섭취량 필수
    if(!a.amount){
      missing.push(item.n+' (1회 섭취량)');
      return;
    }
  });
  if(missing.length>0){
    alert('아직 선택하지 않은 항목이 있어요:\n\n• '+missing.slice(0,5).join('\n• ')+(missing.length>5?'\n• 외 '+(missing.length-5)+'개':''));
    return;
  }
  if(curSec<S.length-1){curSec++;renderSec();window.scrollTo(0,0);}
  else{submitSurvey();}
}

function calcDII(){
  var score=0,count=0;
  S.forEach(function(sec,si){
    sec.items.forEach(function(item,idx){
      var key=si+'_'+idx,a=ANS[key];
      if(!a||!a.freq||a.freq==='거의 안 먹음') return;
      count++;
      var fpd=FSCORES[FREQS.indexOf(a.freq)];
      var c=0;
      ANTI.forEach(function(x){if(item.n.indexOf(x)>=0) c=-0.28;});
      PRO.forEach(function(x){if(item.n.indexOf(x)>=0) c=0.35;});
      score+=c*fpd*7;
    });
  });
  return {score:parseFloat(score.toFixed(2)),count:count};
}

function submitSurvey(){
  var r=calcDII();
  var rec={pid:pid,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),ans:JSON.parse(JSON.stringify(ANS)),dii:r.score,count:r.count};
  if(!GAS_URL){
    SUBS.push(rec);
    showDone(r,false);
    return;
  }
  document.getElementById('main').innerHTML=
    '<div style="text-align:center;padding:4rem 1rem;color:#888;">'+
      '<div style="font-size:40px;margin-bottom:12px;">⏳</div>'+
      '<div style="font-size:15px;font-weight:600;color:#111;">설문을 저장하고 있습니다...</div>'+
      '<div style="font-size:13px;margin-top:4px;">잠시만 기다려 주세요</div>'+
    '</div>';
  var sr=buildSheetRow(r.score,r.count);
  fetch(GAS_URL,{method:'POST',body:JSON.stringify({header:sr.header,row:sr.row})})
    .then(function(res){return res.json();})
    .then(function(d){
      if(d&&d.ok){showDone(r,true);}
      else{throw new Error('save failed');}
    })
    .catch(function(){
      SUBS.push(rec);
      showDone(r,false);
      alert('구글 시트 저장에 실패했습니다.\n네트워크 상태를 확인한 뒤 의료진에게 알려주세요.\n(응답은 이 기기에 임시 보관되었습니다)');
    });
}

function showDone(r,saved){
  var lv=r.score>1?'염증 촉진':r.score>0?'중간':'항염증';
  var bc=r.score>1?'background:#fde8e8;color:#9b1c1c':r.score>0?'background:#fef3c7;color:#92400e':'background:#def7ec;color:#03543f';
  document.getElementById('main').innerHTML=
    '<div style="text-align:center;padding:2rem 0 1rem;">'+
      '<div style="font-size:48px;">✅</div>'+
      '<div style="font-size:20px;font-weight:600;color:#111;margin-top:12px;">설문이 완료되었습니다</div>'+
      '<div style="font-size:14px;color:#888;margin-top:4px;">참여자 번호: '+pid+'</div>'+
      (saved
        ?'<div style="font-size:12px;color:#03543f;background:#def7ec;display:inline-block;border-radius:999px;padding:4px 12px;margin-top:10px;">☁️ 구글 시트에 저장되었습니다</div>'
        :(GAS_URL?'<div style="font-size:12px;color:#92400e;background:#fef3c7;display:inline-block;border-radius:999px;padding:4px 12px;margin-top:10px;">⚠️ 이 기기에만 임시 저장됨</div>':''))+
    '</div>'+
    '<div class="card" style="text-align:center;">'+
      '<div style="font-size:13px;color:#888;margin-bottom:4px;">식이염증지수 (DII)</div>'+
      '<div style="font-size:40px;font-weight:600;color:#111;padding:0.5rem 0;">'+(r.score>0?'+':'')+r.score+'</div>'+
      '<span class="badge" style="'+bc+'">'+lv+'</span>'+
      '<div style="font-size:12px;color:#888;margin-top:8px;">음수: 항염증 식단 / 양수: 염증 촉진 식단</div>'+
    '</div>'+
    '<button class="bigbtn" onclick="restart()">새 설문 시작</button>';
}

function restart(){curSec=0;pid='';ANS={};showId();}

function showDoctor(){
  if(!GAS_URL){renderDoctorList();return;}
  document.getElementById('main').innerHTML=
    '<div style="text-align:center;padding:4rem 1rem;color:#888;">'+
      '<div style="font-size:40px;margin-bottom:12px;">⏳</div>'+
      '<div style="font-size:15px;font-weight:600;color:#111;">구글 시트에서 불러오는 중...</div>'+
    '</div>';
  fetch(GAS_URL)
    .then(function(res){return res.json();})
    .then(function(d){
      SUBS=(d&&d.submissions)?d.submissions:[];
      SHEET_URL=(d&&d.sheetUrl)?d.sheetUrl:'';
      renderDoctorList();
    })
    .catch(function(){
      renderDoctorList('⚠️ 구글 시트 연결에 실패하여 이 기기에 저장된 응답만 표시합니다');
    });
}

function renderDoctorList(warn){
  if(!SUBS.length){
    document.getElementById('main').innerHTML=
      (warn?'<div class="note" style="color:#92400e;background:#fef3c7;">'+warn+'</div>':'')+
      '<div style="text-align:center;padding:3rem 1rem;color:#888;">'+
        '<div style="font-size:40px;margin-bottom:12px;">📋</div>'+
        '<div style="font-size:15px;font-weight:600;color:#111;margin-bottom:4px;">제출된 설문이 없습니다</div>'+
        '<div style="font-size:13px;">환자 모드에서 설문 완료 후 확인하세요</div>'+
      '</div>';
    return;
  }
  var html=(warn?'<div class="note" style="color:#92400e;background:#fef3c7;">'+warn+'</div>':'')+
    '<div style="display:flex;align-items:center;margin-bottom:1rem;">'+
      '<div style="font-size:15px;font-weight:600;color:#111;">제출된 설문 ('+SUBS.length+'건)</div>'+
      '<div style="margin-left:auto;display:flex;gap:6px;">'+
        (SHEET_URL?'<a href="'+SHEET_URL+'" target="_blank" style="font-size:12px;color:#057a55;border:1px solid #057a55;border-radius:8px;padding:6px 12px;text-decoration:none;">📊 시트 열기</a>':'')+
        (GAS_URL?'<button class="mbtn" onclick="showDoctor()" style="font-size:12px;">🔄 새로고침</button>':'')+
      '</div>'+
    '</div>'+
    '<div class="card" style="padding:0 1.25rem;">';
  SUBS.forEach(function(s,i){
    var lv=s.dii>1?'염증 촉진':s.dii>0?'중간':'항염증';
    var bc=s.dii>1?'background:#fde8e8;color:#9b1c1c':s.dii>0?'background:#fef3c7;color:#92400e':'background:#def7ec;color:#03543f';
    html+='<div class="prow" onclick="showDetail('+i+')">'+
      '<div>'+
        '<div style="font-size:14px;font-weight:600;color:#111;">참여자 '+s.pid+'</div>'+
        '<div style="font-size:12px;color:#888;">'+s.time+' · '+s.count+'개 항목 응답</div>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:8px;">'+
        '<span style="font-size:14px;font-weight:600;">DII '+(s.dii>0?'+':'')+s.dii+'</span>'+
        '<span class="badge" style="'+bc+'">'+lv+'</span>'+
      '</div>'+
    '</div>';
  });
  html+='</div>';
  document.getElementById('main').innerHTML=html;
}

function showDetail(i){
  var s=SUBS[i];
  var lv=s.dii>1?'염증 촉진':s.dii>0?'중간':'항염증';
  var bc=s.dii>1?'background:#fde8e8;color:#9b1c1c':s.dii>0?'background:#fef3c7;color:#92400e':'background:#def7ec;color:#03543f';
  var SCOLS={spring:'#059669',summer:'#d97706',fall:'#b45309',winter:'#2563eb'};
  var SBGS={spring:'#ecfdf5',summer:'#fffbeb',fall:'#fef3c7',winter:'#eff6ff'};
  var SLABELS={spring:'봄',summer:'여름',fall:'가을',winter:'겨울'};
  var html=
    '<button onclick="renderDoctorList()" style="background:none;border:none;color:#1a56db;font-size:14px;cursor:pointer;margin-bottom:1rem;padding:0;">← 목록으로</button>'+
    '<div class="card" style="text-align:center;">'+
      '<div style="font-size:13px;color:#888;margin-bottom:4px;">참여자 '+s.pid+' · '+s.time+'</div>'+
      '<div style="font-size:38px;font-weight:600;color:#111;padding:0.5rem 0;">'+(s.dii>0?'+':'')+s.dii+'</div>'+
      '<span class="badge" style="'+bc+'">'+lv+'</span>'+
      '<div style="font-size:12px;color:#888;margin-top:8px;">음수: 항염증 식단 / 양수: 염증 촉진 식단</div>'+
    '</div>'+
    '<div class="card">'+
      '<div style="font-size:14px;font-weight:600;color:#111;margin-bottom:10px;">식품별 응답 내역</div>';

  S.forEach(function(sec,si){
    var has=sec.items.some(function(item,idx){
      var a=s.ans[si+'_'+idx];
      return a&&a.freq;
    });
    if(!has) return;
    html+='<div style="font-size:12px;font-weight:600;color:#1a56db;background:#eff6ff;border-radius:6px;padding:4px 8px;margin:10px 0 6px;">'+sec.name+'</div>';
    sec.items.forEach(function(item,idx){
      var a=s.ans[si+'_'+idx];
      if(!a||!a.freq||a.freq==='거의 안 먹음') return;
      html+='<div class="nrow">'+
        '<div style="flex:1;padding-right:8px;">'+
          '<div style="color:#555;line-height:1.4;font-size:13px;">'+item.n+'</div>';
      // 계절 배지
      if(item.seasonal&&a.seasons){
        html+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">';
        Object.keys(a.seasons).forEach(function(sk){
          if(a.seasons[sk]){
            html+='<span style="font-size:11px;padding:2px 7px;border-radius:999px;background:'+SBGS[sk]+';color:'+SCOLS[sk]+';border:1px solid '+SCOLS[sk]+'50;">'+SLABELS[sk]+'</span>';
          }
        });
        html+='</div>';
      }
      // 세부 질문 응답
      if(item.sub){
        if(item.sub.opts&&a.sub){
          html+='<div style="font-size:11px;color:#7c3aed;margin-top:3px;">→ '+a.sub+'</div>';
        }
        if(item.sub.opts2){
          item.sub.opts2.forEach(function(sq){
            if(a[sq.k]) html+='<div style="font-size:11px;color:#7c3aed;margin-top:2px;">'+sq.q+' '+a[sq.k]+'</div>';
          });
        }
      }
      html+='</div>'+
        '<div style="text-align:right;white-space:nowrap;">'+
          '<div style="color:#111;font-size:12px;">'+a.freq+'</div>'+
          (a.amount?'<div style="color:#888;font-size:11px;">'+a.amount+'</div>':'')+
        '</div>'+
      '</div>';
    });
  });
  html+='</div>';
  document.getElementById('main').innerHTML=html;
}

showId();
