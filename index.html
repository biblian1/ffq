.bigbtn:active { background: #1447b0; }
.pbar { background: #e5e7eb; border-radius: 999px; height: 6px; margin-bottom: 1.5rem; overflow: hidden; }
.pfill { height: 100%; background: #1a56db; border-radius: 999px; transition: width 0.3s; }
.stitle { font-size: 18px; font-weight: 600; color: #111; margin-bottom: 4px; }
.ssub { font-size: 13px; color: #888; margin-bottom: 1rem; }

.navbtn { flex: 1; padding: 13px; border-radius: 8px; border: 1px solid #ccc; background: #fff; color: #111; font-size: 15px; font-weight: 600; cursor: pointer; }
.navbtn.pr { background: #1a56db; color: #fff; border: none; }

.subq { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
.subq-label { font-size: 12px; color: #1a56db; font-weight: 600; margin-bottom: 6px; }
.subq-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.sqbtn.sel { background: #7c3aed; color: #fff; border-color: #7c3aed; font-weight: 600; }


.abtn.sel, .fbtn.sel { background:#1a56db; color:#fff; border-color:#1a56db; }

.seasonbtn.sel { background:#059669; color:#fff; border-color:#059669; }
.qcard { background:#fff; border-radius:12px; padding:1rem 1.25rem; margin-bottom:0.75rem; border:1px solid #e5e7eb; }
.atitle { font-weight:600; font-size:13px; }
.adesc { font-size:12px; color:#888; margin-left:8px; }

.abtn.sel .adesc { color:#cfe0ff; }
.progress { height:6px; background:#e5e7eb; border-radius:3px; overflow:hidden; margin-bottom:1rem; }
.progress > div { height:100%; background:#1a56db; transition:width 0.3s; }

function itemDailyFactor(item, a){
  if(!a || a.freq===undefined || a.freq===0) return 0;
  var fpd = FSCORES[a.freq];              // 1일 섭취횟수
  var ratio = a.amt!==undefined ? item.a.length===4 ? [0.5,1,1.5,2][a.amt] : [0.5,1,1.5][a.amt] : 1;

    if(a.season==='seasonal'){  // 제철에만
      var months = SEASON_MONTHS[item.n] || 12;
      seasonAdj = months/12;
    }
    // '무관'(연중) 또는 미선택이면 seasonAdj=1
  }
  return fpd * ratio * seasonAdj;
}

function addonDailyFactor(item, a, ai){
  if(!a || a.freq===undefined || a.freq===0) return 0;
  if(!a.addons) return 0;
  var v=a.addons[ai];
  if(v===undefined || v===null) return 0;
  var ad=item.addons[ai];
  var ratio = ad.a.length===4 ? [0.5,1,1.5,2][v] : [0.5,1,1.5][v];
  return FSCORES[a.freq] * ratio;
}

  var kSum=kCarb+kFib+kPro+kFat;
  var pct=function(x){ return kSum>0? Math.round(x/kSum*100):0; };
  return {kcal:Math.round(tot[0]),carb:carb,sugar:sugar,complex:complex,fiber:fiber,
          fat:fat,protein:protein,pctCarb:pct(kCarb+kFib),pctPro:pct(kPro),pctFat:pct(kFat)};
}

function calcBody(){
  if(!ht||!wt) return null;
  var m=ht/100, bmi=+(wt/(m*m)).toFixed(1);
  var cat = bmi<18.5?'저체중': bmi<23?'정상': bmi<25?'과체중': bmi<30?'비만':'고도비만';
  var ideal=+(22*m*m).toFixed(1);
  var bmr = (sex==='M') ? (10*wt+6.25*ht-5*age+5) : (10*wt+6.25*ht-5*age-161);
  bmr=Math.round(bmr);
  var factor=ACT_FACTOR[act]||1.2, tdee=Math.round(bmr*factor);
  // 바지 허리 사이즈는 실측 허리둘레가 아니므로 cm 변환·WHtR·복부비만 판정을 하지 않는다
  return {bmi:bmi,cat:cat,ideal:ideal,bmr:bmr,tdee:tdee,factor:factor,actLabel:ACT_LABEL[act]||'',
          pantsInch:waist};
}

function startSurvey(){
  var v=document.getElementById('pidinput').value.trim();
  if(!v){alert('참여자 번호를 입력해 주세요.');return;}
  if(!sex){alert('성별을 선택해 주세요.');return;}
  var ag=parseInt(document.getElementById('ageinput').value);
  var h=parseFloat(document.getElementById('htinput').value);
  var w=parseFloat(document.getElementById('wtinput').value);
  var wa=parseFloat(document.getElementById('waistinput').value);
  if(!ag||ag<1||ag>120){alert('나이를 확인해 주세요.');return;}
  if(!h||h<80||h>230){alert('키를 확인해 주세요.');return;}
  if(!w||w<20||w>250){alert('몸무게를 확인해 주세요.');return;}
  if(!wa||wa<15||wa>70){alert('바지 허리 사이즈를 인치로 확인해 주세요. (15~70인치)');return;}
  if(!act){alert('활동량을 선택해 주세요.');return;}
  if(water===''){alert('물 섭취량을 선택해 주세요.');return;}
  if(pid!==v){ ANS={}; extraFood=''; }   // 참여자번호가 바뀌면 새 설문
  pid=v; age=ag; ht=h; wt=w; waist=wa; curSec=0; renderSec();
}

// 문항별 미응답 항목명을 반환 ('' = 완료)
// '거의 안 먹음'을 고르면 섭취시기·섭취량·우유종류는 묻지 않는다
function itemMissing(item,key){
  var a=ANS[key];
  if(!a || a.freq===undefined) return '섭취 빈도';
  if(a.freq===0) return '';
  if(item.seasonal && !a.season) return '섭취 시기';
  if(a.amt===undefined) return '1회 섭취량';
  if(item.milk && a.milk===undefined) return '우유 종류';
  return '';
}
// 해당 섹션에서 처음 걸리는 미응답 문항
function firstMissing(si){
  var sec=S[si];
  for(var i=0;i<sec.items.length;i++){
    var m=itemMissing(sec.items[i], si+'_'+i);
    if(m) return {sec:si, idx:i, key:si+'_'+i, why:m, name:sec.items[i].n};
  }
  return null;
}
function secDoneCount(si){
  var sec=S[si], n=0;
  for(var i=0;i<sec.items.length;i++) if(!itemMissing(sec.items[i], si+'_'+i)) n++;
  return n;
}
// 받침 유무에 따라 을/를 선택
function josa(w){
  var c=String(w).charCodeAt(String(w).length-1);
  if(c<0xAC00||c>0xD7A3) return '를';
  return ((c-0xAC00)%28) ? '을' : '를';
}
var API_VER='', HILITE='', HILITE_MSG='';
function clearHilite(key){
  if(HILITE!==key) return;
  HILITE=''; HILITE_MSG='';
  var el=document.getElementById('q_'+key);
  if(el){ el.style.borderColor=''; el.style.boxShadow=''; }
}
function markMissing(bad){
  HILITE=bad.key; HILITE_MSG=(bad.idx+1)+'. '+bad.name+' — '+bad.why+josa(bad.why)+' 선택해 주세요';
  refreshItem(bad.key);
  var el=document.getElementById('q_'+bad.key);
  if(el){
    el.style.borderColor='#f05252';
    el.style.boxShadow='0 0 0 3px #fde8e8';
    if(el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'center'});
  }
}
function refreshSecCount(){
  var el=document.getElementById('seccount'); if(!el) return;
  var d=secDoneCount(curSec), t=S[curSec].items.length;
  el.innerHTML = (d<t)
    ? '<span style="color:#92400e;">응답 '+d+' / '+t+' · '+(t-d)+'개 남음</span>'
    : '<span style="color:#03543f;">응답 '+t+' / '+t+' 완료</span>';
}

// 문항 카드 1개의 내부 HTML (스크롤 보존을 위해 카드 단위로 갱신)
function itemInner(item,idx,key){
  var a=ANS[key]||{};
  var h=((HILITE===key&&HILITE_MSG)?'<div style="font-size:12px;font-weight:600;color:#9b1c1c;background:#fde8e8;border-radius:6px;padding:7px 10px;margin-bottom:8px;line-height:1.4;">⚠️ '+HILITE_MSG+'</div>':'')+

      '<div style="font-size:11px;color:#aaa;margin-bottom:8px;">기준: '+item.base+'</div>';

    // 계절 문항 (과일)
    if(item.seasonal && a.freq!==0){
      var sea=a.season||'';
      h+='<div style="font-size:12px;color:#555;margin-bottom:4px;">섭취 시기</div>'+
        '<div style="display:flex;gap:6px;margin-bottom:8px;">'+
          '<button class="seasonbtn'+(sea==='seasonal'?' sel':'')+'" onclick="setSeason(\''+key+'\',\'seasonal\')">제철에만</button>'+
          '<button class="seasonbtn'+(sea==='year'?' sel':'')+'" onclick="setSeason(\''+key+'\',\'year\')">연중 무관</button>'+
        '</div>';
    }

    // 빈도 (9구간) — 계절 안내 문구
    var freqNote = item.seasonal ? ' <span style="color:#059669;">(드시는 시기 기준)</span>' : '';
    h+='<div style="font-size:12px;color:#555;margin-bottom:4px;">섭취 빈도'+freqNote+'</div>'+
      '<div style="display:flex;flex-wrap:wrap;margin-bottom:8px;">';
    FREQS.forEach(function(f,fi){
      var sel=(a.freq===fi)?' sel':'';
      h+='<button class="fbtn2'+sel+'" onclick="setFreq(\''+key+'\','+fi+')">'+f+'</button>';
    });
    h+='</div>';

    // 섭취량 (빈도 선택시만, 거의안먹음 제외)
    if(a.freq!==undefined && a.freq>0){
      h+='<div style="font-size:12px;color:#555;margin-bottom:4px;">1회 섭취량</div>'+
        '<div style="display:flex;gap:6px;margin-bottom:4px;">';
      item.a.forEach(function(amt,ai){
        var sel=(a.amt===ai)?' sel':'';
        h+='<button class="amtbtn'+sel+'" onclick="setAmt(\''+key+'\','+ai+')">'+amt+'</button>';
      });
      h+='</div>';

      // 커피 부재료: 프림 · 설탕
      if(item.addons){
        item.addons.forEach(function(ad,ai){
          var cur=(a.addons&&a.addons[ai]!==undefined&&a.addons[ai]!==null)?a.addons[ai]:null;
          h+='<div class="subq"><div class="subq-label">'+ad.n+' <span style="color:#888;font-weight:400;">· 기준 '+ad.base+'</span></div><div class="subq-btns">'+
            '<button class="sqbtn'+(cur===null?' sel':'')+'" onclick="setAddon(\''+key+'\','+ai+',null)">안 넣음</button>'+
            ad.a.map(function(x,xi){ return '<button class="sqbtn'+(cur===xi?' sel':'')+'" onclick="setAddon(\''+key+'\','+ai+','+xi+')">'+x+'</button>'; }).join('')+
          '</div></div>';
        });
      }

      // 특수: 우유 종류
      if(item.milk){
        h+='<div style="font-size:12px;color:#555;margin:8px 0 4px;">우유 종류</div><div style="display:flex;gap:6px;">'+
          ['일반우유','저지방우유'].map(function(m,mi){
            var sel=(a.milk===mi)?' sel':'';
            return '<button class="amtbtn'+sel+'" onclick="setMilk(\''+key+'\','+mi+')">'+m+'</button>';
          }).join('')+'</div>';
      }
      // 특수: 커피 하루 3회 초과
      if(item.coffee && a.freq===8){
        h+='<div style="font-size:12px;color:#555;margin:8px 0 4px;">하루 몇 잔? (3잔 초과 시)</div>'+
          '<input type="number" inputmode="numeric" placeholder="예: 5" value="'+(a.coffeeN||'')+'" onchange="setCoffeeN(\''+key+'\',this.value)" style="width:100px;padding:6px;border:1px solid #d1d5db;border-radius:6px;text-align:center;"/>';
      }
      // 특수: 주류 초과
      if(item.alcohol){
        h+='<div style="font-size:11px;color:#888;margin-top:6px;">※ '+item.alcohol+' 드시면 의료진에게 알려주세요</div>';
      }
    }
  return h;
}

// 해당 문항 카드만 다시 그린다 → 화면 스크롤 위치가 그대로 유지됨

  var idx=parseInt(key.split('_')[1],10);
  var item=S[curSec].items[idx];
  var el=document.getElementById('q_'+key);
  if(el && item) el.innerHTML=itemInner(item,idx,key);

function setFreq(key,fi){ if(!ANS[key])ANS[key]={}; ANS[key].freq=fi; if(fi===0){delete ANS[key].amt;} clearHilite(key); refreshItem(key); refreshSecCount(); }
function setAmt(key,ai){ if(!ANS[key])ANS[key]={}; ANS[key].amt=ai; clearHilite(key); refreshItem(key); refreshSecCount(); }
function setSeason(key,s){ if(!ANS[key])ANS[key]={}; ANS[key].season=s; clearHilite(key); refreshItem(key); refreshSecCount(); }
function setMilk(key,mi){ if(!ANS[key])ANS[key]={}; ANS[key].milk=mi; clearHilite(key); refreshItem(key); refreshSecCount(); }
function setAddon(key,ai,v){ if(!ANS[key])ANS[key]={}; if(!ANS[key].addons)ANS[key].addons={};
  if(v===null) delete ANS[key].addons[ai]; else ANS[key].addons[ai]=v; refreshItem(key); }
function setCoffeeN(key,v){ if(!ANS[key])ANS[key]={}; ANS[key].coffeeN=v; }
function prevSec(){ if(curSec>0){curSec--;renderSec();} }
function nextSec(){
  var bad=firstMissing(curSec);
  if(bad){ markMissing(bad); return; }
  if(curSec<S.length-1){ curSec++; renderSec(); return; }
  // 제출 직전 전체 식품군 재점검 (뒤로 갔다 온 경우 대비)
  for(var i=0;i<S.length;i++){
    var b=firstMissing(i);
    if(b){ curSec=i; renderSec(); markMissing(b); return; }
  }
  submitSurvey();
}

function countAnswered(){
  var c=0;
  S.forEach(function(sec,si){ sec.items.forEach(function(it,idx){ var a=ANS[si+'_'+idx]; if(a&&a.freq!==undefined&&a.freq>0)c++; }); });
  return c;
}

function buildSheetRow(count){
  var nu=calcNutrition();
  var b=calcBody()||{bmi:'',cat:'',ideal:'',bmr:'',tdee:'',actLabel:'',pantsInch:''};
  var header=['제출일시','참여자번호','성별','나이','키(cm)','몸무게(kg)','BMI','체중분류',
    '바지사이즈(인치)',
    '활동량','기초대사량(kcal)','활동대사량(kcal)','표준체중(kg)','물섭취량',
    '섭취칼로리(kcal)','열량적정성(%)','에너지수지(kcal)',
    '탄수화물(g)','복합당(g)','당류(g)','식이섬유(g)','단백질(g)','지방(g)',
    '탄수비율(%)','단백비율(%)','지방비율(%)','응답항목수','추가 음식(주관식)'];
  var kcalPct = b.tdee? Math.round(nu.kcal/b.tdee*100):'';
  var balance = b.tdee? (nu.kcal-b.tdee):'';
  var sexKo = sex==='M'?'남':(sex==='F'?'여':'');
  var row=[new Date().toLocaleString('ko-KR'),pid,sexKo,age,ht,wt,b.bmi,b.cat,
    (b.pantsInch||''),
    b.actLabel,b.bmr,b.tdee,b.ideal,WATER_LABEL[water]||'',
    nu.kcal,kcalPct,balance,
    nu.carb,nu.complex,nu.sugar,nu.fiber,nu.protein,nu.fat,
    nu.pctCarb,nu.pctPro,nu.pctFat,count,extraFood];
  // 식품별 응답 열
  S.forEach(function(sec,si){
    sec.items.forEach(function(item,idx){
      header.push('['+sec.name+'] '+item.n);
      var a=ANS[si+'_'+idx];
      var on=!(!a||a.freq===undefined||a.freq===0);
      if(!on){ row.push(''); }
      else {
        var parts=[FREQS[a.freq]];
        if(a.amt!==undefined) parts.push(item.a[a.amt]);
        if(item.seasonal&&a.season) parts.push(a.season==='seasonal'?'제철':'연중');
        if(item.milk&&a.milk!==undefined) parts.push(['일반','저지방'][a.milk]);
        if(item.coffee&&a.coffeeN) parts.push(a.coffeeN+'잔');
        row.push(parts.join(' / '));
      }
      // 부재료는 별도 열로 (분석 편의)
      if(item.addons){
        item.addons.forEach(function(ad,ai){
          header.push('['+sec.name+'] '+item.n+' - '+ad.n);
          var v=(on&&a.addons)?a.addons[ai]:undefined;
          row.push((v===undefined||v===null)?'':(FREQS[a.freq]+' / '+ad.a[v]));
        });
      }
    });
  });
  header.push('_RAW'); row.push(JSON.stringify(ANS));
  return {header:header,row:row};
}

var LAST_SAVE_ERROR='';
function submitSurvey(){
  var cnt=countAnswered();
  var nu=calcNutrition(), body=calcBody();
  var rec={pid:pid,sex:sex,age:age,ht:ht,wt:wt,waist:waist,act:act,water:water,body:body,nu:nu,extra:extraFood,local:true,
    time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),
    ans:JSON.parse(JSON.stringify(ANS)),count:cnt};
  if(!GAS_URL){ SUBS.push(rec); showDone(true,false); return; }
  document.getElementById('main').innerHTML='<div style="text-align:center;padding:4rem 1rem;color:#888;"><div style="font-size:40px;">⏳</div><div style="font-size:15px;font-weight:600;color:#111;margin-top:12px;">저장 중입니다...</div></div>';
  var sr=buildSheetRow(cnt);
  fetch(GAS_URL,{method:'POST',body:JSON.stringify({header:sr.header,row:sr.row})})
    .then(function(res){
      if(!res.ok) throw new Error('HTTP '+res.status+' — 배포 URL이 유효하지 않거나 삭제된 배포입니다');
      return res.text();
    })
    .then(function(t){
      var d;
      try { d=JSON.parse(t); }
      catch(e){
        if(/accounts\.google\.com|Sign in|로그인/i.test(t)) throw new Error('구글 로그인 요구 — 배포 액세스 권한을 "모든 사용자"로 변경하세요');
        if(/doPost/i.test(t)) throw new Error('doPost 함수를 찾을 수 없음 — Code.gs 저장 후 "배포 관리"에서 새 버전으로 재배포하세요');
        throw new Error('응답이 JSON이 아님: '+t.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,150));
      }
      if(!d || !d.ok) throw new Error('시트 쓰기 오류 — '+((d&&d.error)||'원인 불명'));
      LAST_SAVE_ERROR=''; showDone(true,true);
    })
    .catch(function(e){
      var m=String(e&&e.message||e);
      if(/Failed to fetch|NetworkError|Load failed/i.test(m)) m='요청이 차단됨 — 배포 액세스 권한이 "모든 사용자"가 아니거나 네트워크/CORS 문제입니다';
      console.error('[저장 실패]', e);
      LAST_SAVE_ERROR=m;
      SUBS.push(rec); showDone(true,false);
    });
}

  var carbBar='<div style="margin-top:14px;"><div style="font-size:12px;color:#555;margin-bottom:6px;">탄수화물 세부 구성 (총 '+n.carb+'g)</div>'+
    '<div style="display:flex;height:26px;border-radius:6px;overflow:hidden;font-size:11px;color:#fff;font-weight:600;">'+
      seg(cp(n.complex),'#4f46e5','복합당 '+cp(n.complex)+'%')+seg(cp(n.sugar),'#db2777','단순당 '+cp(n.sugar)+'%')+seg(cp(n.fiber),'#059669','섬유 '+cp(n.fiber)+'%')+
    '</div><div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin-top:5px;">'+
      '<span>복합당 '+n.complex+'g · '+cp(n.complex)+'%</span><span>단순당 '+n.sugar+'g · '+cp(n.sugar)+'%</span><span>식이섬유 '+n.fiber+'g · '+cp(n.fiber)+'%</span></div>'+
    '<div style="font-size:10px;color:#aaa;margin-top:4px;">식이섬유·당류는 총탄수화물에 포함되는 하위 항목입니다.</div></div>';
  return '<div class="qcard"><div style="font-size:14px;font-weight:600;color:#111;margin-bottom:10px;">하루 평균 영양 섭취 (추정)</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">'+grid+'</div>'+macroBar+carbBar+'</div>';
}

function showDetail(i){
  var s=SUBS[i];
  var html='<button onclick="renderDoctorList()" style="background:none;border:none;color:#1a56db;font-size:14px;cursor:pointer;margin-bottom:1rem;padding:0;">← 목록으로</button>'+
    '<div style="font-size:16px;font-weight:600;color:#111;margin-bottom:1rem;">참여자 '+s.pid+' <span style="font-size:13px;color:#888;font-weight:400;">· '+s.time+'</span></div>'+
    bodyCard(s)+nutriDetailCard(s)+
    '<div class="qcard"><div style="font-size:14px;font-weight:600;color:#111;margin-bottom:10px;">식품별 응답 내역</div>';
  var ans=s.ans||{};
  var foods=s.foods||null;               // 열 이름 기준 응답 (있으면 우선 사용)
  var hasFoods=foods&&Object.keys(foods).length>0;
  S.forEach(function(sec,si){
    var secItems=[];
    sec.items.forEach(function(item,idx){
      var label='['+sec.name+'] '+item.n, txt='';
      if(hasFoods){
        // 시트 열 이름으로 직접 조회 → 문항 순서가 바뀌어도 어긋나지 않음
        if(!foods[label]) return;
        txt=String(foods[label]);
        if(item.addons){ item.addons.forEach(function(ad){
          var t=foods[label+' - '+ad.n];
          if(t) txt+=' / '+ad.n+' '+String(t).split(' / ').pop();
        }); }
      } else {
        var a=ans[si+'_'+idx];
        if(!a||a.freq===undefined||a.freq===0) return;
        var parts=[FREQS[a.freq]];
        if(a.amt!==undefined&&item.a) parts.push(item.a[a.amt]);
        if(item.seasonal&&a.season) parts.push(a.season==='seasonal'?'제철':'연중');
        if(item.addons&&a.addons){ item.addons.forEach(function(ad,ai){ var v=a.addons[ai];
          if(v!==undefined&&v!==null) parts.push(ad.n+' '+ad.a[v]); }); }
        txt=parts.join(' / ');
      }
      if(!txt) return;
      secItems.push('<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px;"><span style="color:#374151;">'+item.n+'</span><span style="color:#888;">'+txt+'</span></div>');
    });
    if(secItems.length){
      html+='<div style="font-size:12px;font-weight:600;color:#1a56db;background:#eff6ff;padding:4px 8px;border-radius:6px;margin:8px 0 4px;">'+sec.name+'</div>'+secItems.join('');
    }
  });
  if(!/padding:5px 0/.test(html)){
    var why=[], fix='';
    if(s.local){
      why.push('이 응답은 시트 저장에 실패해 이 기기에만 임시 저장된 건입니다');
      fix='시트에는 기록되지 않았습니다. 참여자에게 다시 제출을 요청하시거나, 스프레드시트에 직접 입력해 주세요.';
    } else if(s.foods===undefined || s.foods===null){
      why.push('시트에서 식품 응답 열을 받지 못했습니다 (수신 API: '+(API_VER||'없음')+')');
      fix='앱이 옛 배포 주소를 보고 있습니다. index.html의 GAS_URL과 실제 배포 URL이 같은지 확인하세요. '+
          '"새 배포"를 누르면 URL이 새로 생기므로, 같은 주소를 유지하려면 [배포 관리 → 연필 → 새 버전]을 사용해야 합니다.';
    } else if(!Object.keys(s.foods).length){
      why.push('시트의 식품 응답 열이 비어 있습니다');
      fix=(s.count>0)
        ? '응답항목수는 '+s.count+'건인데 내용이 비어 있습니다. 저장 도중 열이 잘렸을 가능성이 높습니다(구버전 저장).'
        : '이 참여자는 실제로 응답한 식품이 없습니다.';
    }
    if(!s.ans || !Object.keys(s.ans).length) why.push('_RAW 원본도 없습니다');
    html+='<div style="font-size:13px;color:#92400e;background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:12px;line-height:1.7;">'+
      '<div style="font-weight:600;margin-bottom:4px;">식품별 응답을 불러오지 못했습니다</div>'+
      '<div style="font-size:12px;">· '+why.join('<br>· ')+'</div>'+
      (fix?'<div style="font-size:12px;margin-top:8px;padding-top:8px;border-top:1px solid #fde68a;">'+fix+'</div>':'')+
      '</div>';
  }
  html+='</div>';
  if(s.extra){
    html+='<div class="qcard"><div style="font-size:14px;font-weight:600;color:#111;margin-bottom:8px;">추가로 드시는 음식 (주관식)</div>'+
      '<div style="font-size:13px;color:#374151;line-height:1.7;white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;">'+escHtml(s.extra)+'</div></div>';
  }
  document.getElementById('main').innerHTML=html;
  window.scrollTo(0,0);
}

// 초기화
showId();

</script>
</body>
</html>
