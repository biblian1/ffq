// ── 활동량 계수 (Mifflin-St Jeor TDEE) ──
var ACT_FACTOR={sedentary:1.2,light:1.375,moderate:1.55,active:1.725,veryactive:1.9};
var ACT_LABEL={sedentary:'매우 비활동적',light:'가벼운 활동',moderate:'중간 활동',active:'매우 활동적',veryactive:'극도로 활동적'};

// ── 영양성분 계산 ──
// FSCORES = 1일당 섭취 횟수. 1일 평균 영양섭취량 = Σ(1회영양가 × 일일횟수)
function calcNutrition(){
  var tot=[0,0,0,0,0,0]; // kcal,carb,sugar,fat,protein,fiber
  S.forEach(function(sec,si){
    sec.items.forEach(function(item,idx){
      var a=ANS[si+'_'+idx];
      if(!a||!a.freq||a.freq==='거의 안 먹음') return;
      var nu=NUTRI[item.n];
      if(!nu) return;
      var perServ=nu.g/100; // 1회분량 배수
      var fpd=FSCORES[FREQS.indexOf(a.freq)]; // 1일 섭취횟수
      for(var k=0;k<6;k++){
        tot[k]+= nu.p[k]*perServ*fpd;
      }
    });
  });
  var carb=+tot[1].toFixed(1), sugar=+tot[2].toFixed(1), fat=+tot[3].toFixed(1),
      protein=+tot[4].toFixed(1), fiber=+tot[5].toFixed(1);
  // 복합당(전분 등) = 총탄수 - 당류 - 식이섬유 (음수 방지)
  var complex=+Math.max(0, carb - sugar - fiber).toFixed(1);
  // 다량영양소 열량(Atwater): 탄수 4, 단백 4, 지방 9, 식이섬유 2
  var kCarb=(carb-fiber)*4, kFib=fiber*2, kPro=protein*4, kFat=fat*9;
  var kSum=kCarb+kFib+kPro+kFat;
  var pct=function(x){ return kSum>0? Math.round(x/kSum*100):0; };
  return {kcal:Math.round(tot[0]),carb:carb,sugar:sugar,complex:complex,fiber:fiber,
          fat:fat,protein:protein,
          pctCarb:pct(kCarb+kFib),pctPro:pct(kPro),pctFat:pct(kFat)};
}

// BMI + 기초대사량(Mifflin-St Jeor) + 활동대사량(TDEE)
function calcBody(){
  if(!ht||!wt) return null;
  var m=ht/100;
  var bmi=+(wt/(m*m)).toFixed(1);
  // 대한비만학회 아시아 기준
  var cat = bmi<18.5?'저체중': bmi<23?'정상': bmi<25?'과체중': bmi<30?'비만':'고도비만';
  var ideal=+(22*m*m).toFixed(1); // 표준체중(BMI 22)
  // Mifflin-St Jeor BMR
  var bmr = (sex==='M')
    ? (10*wt + 6.25*ht - 5*age + 5)
    : (10*wt + 6.25*ht - 5*age - 161);
  bmr=Math.round(bmr);
  var factor=ACT_FACTOR[act]||1.2;
  var tdee=Math.round(bmr*factor);
  return {bmi:bmi,cat:cat,ideal:ideal,bmr:bmr,tdee:tdee,factor:factor,actLabel:ACT_LABEL[act]||''};
}

// 구글 시트에 저장할 헤더/행 생성 (식품별 1열)
function buildSheetRow(dii,count){
  var nu=calcNutrition();
  var b=calcBody()||{bmi:'',cat:'',ideal:'',bmr:'',tdee:'',actLabel:''};
  var header=['제출일시','참여자번호','성별','나이','키(cm)','몸무게(kg)','BMI','체중분류',
    '활동량','기초대사량(kcal)','활동대사량(kcal)','표준체중(kg)',
    '섭취칼로리(kcal)','열량적정성(%)','에너지수지(kcal)',
    '탄수화물(g)','복합당(g)','당류(g)','식이섬유(g)','단백질(g)','지방(g)',
    '탄수비율(%)','단백비율(%)','지방비율(%)','DII','응답항목수'];
  var kcalPct = b.tdee? Math.round(nu.kcal/b.tdee*100):'';
  var balance = b.tdee? (nu.kcal-b.tdee):'';
  var sexKo = sex==='M'?'남':(sex==='F'?'여':'');
  var row=[new Date().toLocaleString('ko-KR'),pid,sexKo,age,ht,wt,b.bmi,b.cat,
    b.actLabel,b.bmr,b.tdee,b.ideal,
    nu.kcal,kcalPct,balance,
    nu.carb,nu.complex,nu.sugar,nu.fiber,nu.protein,nu.fat,
    nu.pctCarb,nu.pctPro,nu.pctFat,dii,count];
  S.forEach(function(sec,si){
    sec.items.forEach(function(item,idx){
      header.push('['+sec.name+'] '+item.n);
      var a=ANS[si+'_'+idx]||{};
      if(!a.freq){row.push('');return;}
      var parts=[a.freq];
      if(a.amount) parts.push(a.amount);
      if(a.seasons){
        var ss=Object.keys(a.seasons).filter(function(k){return a.seasons[k];}).map(function(k){return SEASON_LABEL[k];});
        if(ss.length) parts.push(ss.join('·'));
      }
      if(a.sub) parts.push(a.sub);
      if(a.sugar) parts.push('설탕:'+a.sugar);
      if(a.cream) parts.push('프림:'+a.cream);
      row.push(parts.join(' / '));
    });
  });
  header.push('_RAW');
  row.push(JSON.stringify(ANS));
  return {header:header,row:row};
}

    '<span style="font-size:12px;color:#888;margin-left:8px;">'+desc+'</span>'+
  '</button>';
}
function pickSex(s){ sex=s; refreshBasic(); }
function pickAct(a){ act=a; refreshBasic(); }
function refreshBasic(){
  ['M','F'].forEach(function(x){ var el=document.getElementById('sex_'+x); if(el) el.className='fbtn'+(sex===x?' sel':''); });
  Object.keys(ACT_FACTOR).forEach(function(k){ var el=document.getElementById('act_'+k); if(el) el.className='abtn'+(act===k?' sel':''); });
}

function startSurvey(){
  var v=document.getElementById('pidinput').value.trim();
  if(!v){alert('참여자 번호를 입력해 주세요.');return;}
  if(!sex){alert('성별을 선택해 주세요.');return;}
  var ag=parseInt(document.getElementById('ageinput').value);
  var h=parseFloat(document.getElementById('htinput').value);
  var w=parseFloat(document.getElementById('wtinput').value);
  if(!ag){alert('나이를 입력해 주세요.');return;}
  if(ag<1||ag>120){alert('나이를 다시 확인해 주세요. (1~120세)');return;}
  if(!h||!w){alert('키와 몸무게를 입력해 주세요.');return;}
  if(h<80||h>230){alert('키를 다시 확인해 주세요. (80~230cm)');return;}
  if(w<20||w>250){alert('몸무게를 다시 확인해 주세요. (20~250kg)');return;}
  if(!act){alert('평소 활동량을 선택해 주세요.');return;}
  pid=v; age=ag; ht=h; wt=w; ANS={}; curSec=0; renderSec();
}

function renderSec(){
  var sec=S[curSec];
  var pct=Math.round(curSec/S.length*100);
  var html=
    '<div class="stepind">'+(curSec+1)+' / '+S.length+'</div>'+
    '<div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div>'+
    '<div class="stitle">'+sec.name+'</div>'+
    '<div class="ssub">지난 1년간 평균 섭취 빈도와 1회 섭취 분량을 선택해 주세요</div>';

  sec.items.forEach(function(item,idx){
    var key=curSec+'_'+idx;
    var d=ANS[key]||{};
    var selF=d.freq||'';
    var selA=d.amount||'';
    var never=selF==='거의 안 먹음';

    var incomplete = selF==='' || (!never && !selA);
    html+='<div class="fitem" style="'+(incomplete&&selF!==''?'border-color:#ef4444;':'')+'">';
    if(item.note) html+='<div class="note">★ '+item.note+'</div>';
    html+='<div class="fname">'+item.n+'</div>';

    // [계절 과일] 드시는 계절 체크
    if(item.seasonal){
      html+='<div class="flabel">드시는 계절 (해당되는 계절 모두 선택)</div>'+
            '<div class="season-row">';
      SEASONS.forEach(function(s){
        var checked=d.seasons&&d.seasons[s.key];
        html+='<button class="sbtn'+(checked?' '+s.cls:'')+'" onclick="toggleSeason(\''+key+'\',\''+s.key+'\')">'+s.label+'</button>';
      });
      html+='</div><div class="divider"></div>';
    }

    // 섭취 빈도 (공통)
    html+='<div class="flabel">섭취 빈도</div><div class="fbtns">';
    FREQS.forEach(function(f){
      html+='<button class="fbtn'+(selF===f?' sel':'')+'" onclick="pickFreq(\''+key+'\',\''+f+'\')">'+f+'</button>';
    });
    html+='</div>';

    // 1회 섭취량 (공통 — 빈도 선택 후 거의 안 먹음이 아닐 때)
    if(selF && !never){
      html+='<div class="flabel">1회 섭취량</div><div class="abtns">';
      item.a.forEach(function(a){
        var aEsc=a.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        html+='<button class="abtn'+(selA===a?' sel':'')+'" onclick="pickAmt(\''+key+'\',\''+aEsc+'\')">'+a+'</button>';
      });
      html+='</div>';
    }

    // 세부 질문 (밥 종류, 계란 형태, 우유 형태, 요구르트 형태)
    if(item.sub && selF && !never){
      if(item.sub.opts){
        var selSub=d.sub||'';
        html+='<div class="subq">'+
          '<div class="subq-label">★ '+item.sub.q+'</div>'+
          '<div class="subq-btns">';
        item.sub.opts.forEach(function(o){
          var oEsc=o.replace(/'/g,"\\'");
          html+='<button class="sqbtn'+(selSub===o?' sel':'')+'" onclick="pickSub(\''+key+'\',\''+oEsc+'\')">'+o+'</button>';
        });
        html+='</div></div>';
      }
      // 커피 설탕/프림
      if(item.sub.opts2){
        item.sub.opts2.forEach(function(sq){
          var selSub=d[sq.k]||'';
          html+='<div class="subq">'+
            '<div class="subq-label">★ '+sq.q+'</div>'+
            '<div class="subq-btns">';
          sq.opts.forEach(function(o){
            var oEsc=o.replace(/'/g,"\\'");
            html+='<button class="sqbtn'+(selSub===o?' sel':'')+'" onclick="pickSubKey(\''+key+'\',\''+sq.k+'\',\''+oEsc+'\')">'+o+'</button>';
          });
          html+='</div></div>';
        });
      }
    }

    html+='</div>';
  });

  html+='<div class="navbtns">'+
    (curSec>0?'<button class="navbtn" onclick="goPrev()">← 이전</button>':'')+
    '<button class="navbtn pr" onclick="goNext()">'+(curSec<S.length-1?'다음 →':'제출하기')+'</button>'+
    '</div>';
  document.getElementById('main').innerHTML=html;
}

function pickSub(key,v){
  if(!ANS[key]) ANS[key]={};
  ANS[key].sub=v;
  renderSec();
}
function pickSubKey(key,k,v){
  if(!ANS[key]) ANS[key]={};
  ANS[key][k]=v;
  renderSec();
}
function toggleSeason(key,sk){
  if(!ANS[key]) ANS[key]={};
  if(!ANS[key].seasons) ANS[key].seasons={};
  ANS[key].seasons[sk]=!ANS[key].seasons[sk];
  renderSec();
}
function pickFreq(key,f){
  if(!ANS[key]) ANS[key]={};
  ANS[key].freq=f;
  if(f==='거의 안 먹음') ANS[key].amount=null;
  renderSec();
}
function pickAmt(key,a){
  if(!ANS[key]) ANS[key]={};
  ANS[key].amount=a;
  renderSec();
}
function goPrev(){if(curSec>0){curSec--;renderSec();window.scrollTo(0,0);}}
function goNext(){
  // 미완료 항목 체크
  var sec=S[curSec];
  var missing=[];
  sec.items.forEach(function(item,idx){
    var key=curSec+'_'+idx;
    var a=ANS[key]||{};
    // 섭취빈도 필수
    if(!a.freq){
      missing.push(item.n);
      return;
    }
    // 거의 안 먹음이면 이하 불필요
    if(a.freq==='거의 안 먹음') return;
    // 1회 섭취량 필수
    if(!a.amount){
      missing.push(item.n+' (1회 섭취량)');
      return;
    }
  });
  if(missing.length>0){
    alert('아직 선택하지 않은 항목이 있어요:\n\n• '+missing.slice(0,5).join('\n• ')+(missing.length>5?'\n• 외 '+(missing.length-5)+'개':''));
    return;
  }
  if(curSec<S.length-1){curSec++;renderSec();window.scrollTo(0,0);}
  else{submitSurvey();}
}

function calcDII(){
  var score=0,count=0;
  S.forEach(function(sec,si){
    sec.items.forEach(function(item,idx){
      var key=si+'_'+idx,a=ANS[key];
      if(!a||!a.freq||a.freq==='거의 안 먹음') return;
      count++;
      var fpd=FSCORES[FREQS.indexOf(a.freq)];
      var c=0;
      ANTI.forEach(function(x){if(item.n.indexOf(x)>=0) c=-0.28;});
      PRO.forEach(function(x){if(item.n.indexOf(x)>=0) c=0.35;});
      score+=c*fpd*7;
    });
  });
  return {score:parseFloat(score.toFixed(2)),count:count};
}

function submitSurvey(){
  var r=calcDII();
  var nu=calcNutrition();
  var body=calcBody();
  var rec={pid:pid,sex:sex,age:age,ht:ht,wt:wt,act:act,body:body,nu:nu,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),ans:JSON.parse(JSON.stringify(ANS)),dii:r.score,count:r.count};
  if(!GAS_URL){
    SUBS.push(rec);
    showDone(r,false);
    return;
  }
  document.getElementById('main').innerHTML=
    '<div style="text-align:center;padding:4rem 1rem;color:#888;">'+
      '<div style="font-size:40px;margin-bottom:12px;">⏳</div>'+
      '<div style="font-size:15px;font-weight:600;color:#111;">설문을 저장하고 있습니다...</div>'+
      '<div style="font-size:13px;margin-top:4px;">잠시만 기다려 주세요</div>'+
    '</div>';
  var sr=buildSheetRow(r.score,r.count);
  fetch(GAS_URL,{method:'POST',body:JSON.stringify({header:sr.header,row:sr.row})})
    .then(function(res){return res.json();})
    .then(function(d){
      if(d&&d.ok){showDone(r,true);}
      else{throw new Error('save failed');}
    })
    .catch(function(){
      SUBS.push(rec);
      showDone(r,false);
      alert('구글 시트 저장에 실패했습니다.\n네트워크 상태를 확인한 뒤 의료진에게 알려주세요.\n(응답은 이 기기에 임시 보관되었습니다)');
    });
}

        :(GAS_URL?'<div style="font-size:12px;color:#92400e;background:#fef3c7;display:inline-block;border-radius:999px;padding:4px 12px;margin-top:10px;">⚠️ 이 기기에만 임시 저장됨</div>':''))+

        seg(n.pctFat,'#d97706','지방 '+n.pctFat+'%')+
      '</div>'+
      '<div style="font-size:10px;color:#aaa;margin-top:4px;">권장 비율 — 탄수 55~65% · 단백 7~20% · 지방 15~30% (한국인 영양소 섭취기준)</div>'+
    '</div>';

  // 탄수화물 세부 구성 (복합당/당류/식이섬유)
  var carbTot=n.complex+n.sugar+n.fiber;
  var cp=function(x){ return carbTot>0?Math.round(x/carbTot*100):0; };
  var carbBar=
    '<div style="margin-top:14px;">'+
      '<div style="font-size:12px;color:#555;margin-bottom:6px;">탄수화물 세부 구성 (총 '+n.carb+'g)</div>'+
      '<div style="display:flex;height:26px;border-radius:6px;overflow:hidden;font-size:11px;color:#fff;font-weight:600;">'+
        seg(cp(n.complex),'#4f46e5','복합당 '+cp(n.complex)+'%')+
        seg(cp(n.sugar),'#db2777','단순당 '+cp(n.sugar)+'%')+
        seg(cp(n.fiber),'#059669','섬유 '+cp(n.fiber)+'%')+
      '</div>'+
      '<div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin-top:5px;">'+
        '<span>복합당(전분 등) '+n.complex+'g · '+cp(n.complex)+'%</span>'+
        '<span>단순당 '+n.sugar+'g · '+cp(n.sugar)+'%</span>'+
        '<span>식이섬유 '+n.fiber+'g · '+cp(n.fiber)+'%</span>'+
      '</div>'+
      '<div style="font-size:10px;color:#aaa;margin-top:4px;">식이섬유·당류는 총탄수화물에 포함되는 하위 항목입니다.</div>'+
    '</div>';

  return '<div class="card">'+
    '<div style="font-size:14px;font-weight:600;color:#111;margin-bottom:10px;">하루 평균 영양 섭취 (추정)</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">'+grid+'</div>'+
    macroBar+carbBar+
  '</div>';
}

function seg(pct,color,label){
  if(pct<=0) return '';
  return '<div style="flex:'+pct+' 0 0;background:'+color+';display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;white-space:nowrap;padding:0 2px;">'+(pct>=8?label:'')+'</div>';
}

function showDetail(i){
  var s=SUBS[i];
  var SCOLS={spring:'#059669',summer:'#d97706',fall:'#b45309',winter:'#2563eb'};
  var SBGS={spring:'#ecfdf5',summer:'#fffbeb',fall:'#fef3c7',winter:'#eff6ff'};
  var SLABELS={spring:'봄',summer:'여름',fall:'가을',winter:'겨울'};
  var html=
    '<button onclick="renderDoctorList()" style="background:none;border:none;color:#1a56db;font-size:14px;cursor:pointer;margin-bottom:1rem;padding:0;">← 목록으로</button>'+
    '<div style="font-size:16px;font-weight:600;color:#111;margin-bottom:1rem;">참여자 '+s.pid+' <span style="font-size:13px;color:#888;font-weight:400;">· '+s.time+'</span></div>'+
    bodyCard(s)+
    nutriDetailCard(s)+
    '<div class="card">'+
      '<div style="font-size:14px;font-weight:600;color:#111;margin-bottom:10px;">식품별 응답 내역</div>';

  S.forEach(function(sec,si){
    var has=sec.items.some(function(item,idx){
      var a=s.ans[si+'_'+idx];
      return a&&a.freq;
    });
    if(!has) return;
    html+='<div style="font-size:12px;font-weight:600;color:#1a56db;background:#eff6ff;border-radius:6px;padding:4px 8px;margin:10px 0 6px;">'+sec.name+'</div>';
    sec.items.forEach(function(item,idx){
      var a=s.ans[si+'_'+idx];
      if(!a||!a.freq||a.freq==='거의 안 먹음') return;
      html+='<div class="nrow">'+
        '<div style="flex:1;padding-right:8px;">'+
          '<div style="color:#555;line-height:1.4;font-size:13px;">'+item.n+'</div>';
      // 계절 배지
      if(item.seasonal&&a.seasons){
        html+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">';
        Object.keys(a.seasons).forEach(function(sk){
          if(a.seasons[sk]){
            html+='<span style="font-size:11px;padding:2px 7px;border-radius:999px;background:'+SBGS[sk]+';color:'+SCOLS[sk]+';border:1px solid '+SCOLS[sk]+'50;">'+SLABELS[sk]+'</span>';
          }
        });
        html+='</div>';
      }
      // 세부 질문 응답
      if(item.sub){
        if(item.sub.opts&&a.sub){
          html+='<div style="font-size:11px;color:#7c3aed;margin-top:3px;">→ '+a.sub+'</div>';
        }
        if(item.sub.opts2){
          item.sub.opts2.forEach(function(sq){
            if(a[sq.k]) html+='<div style="font-size:11px;color:#7c3aed;margin-top:2px;">'+sq.q+' '+a[sq.k]+'</div>';
          });
        }
      }
      html+='</div>'+
        '<div style="text-align:right;white-space:nowrap;">'+
          '<div style="color:#111;font-size:12px;">'+a.freq+'</div>'+
          (a.amount?'<div style="color:#888;font-size:11px;">'+a.amount+'</div>':'')+
        '</div>'+
      '</div>';
    });
  });
  html+='</div>';
  document.getElementById('main').innerHTML=html;
}

showId();
</script>
</body>
</html>
